name: Verify portable framework

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Check architecture, build, test, and run headless sample
        shell: pwsh
        run: ./tools/verify.ps1

  godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Download pinned Godot .NET editor and verify official checksum
        shell: bash
        run: |
          mkdir -p artifacts/tools/godot
          cd artifacts/tools/godot
          curl --fail --location --output editor.zip https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_mono_linux_x86_64.zip
          curl --fail --location --output SHA512-SUMS.txt https://github.com/godotengine/godot/releases/download/4.5.2-stable/SHA512-SUMS.txt
          cp editor.zip Godot_v4.5.2-stable_mono_linux_x86_64.zip
          grep -E '^[[:xdigit:]]{128} [ *]Godot_v4\.5\.2-stable_mono_linux_x86_64\.zip$' SHA512-SUMS.txt | sha512sum --check -
          unzip -q editor.zip
          chmod +x Godot_v4.5.2-stable_mono_linux_x86_64/Godot_v4.5.2-stable_mono_linux.x86_64
      - name: Compile and run the real Godot host
        shell: pwsh
        run: ./tools/verify-godot.ps1 -EditorPath ./artifacts/tools/godot/Godot_v4.5.2-stable_mono_linux_x86_64/Godot_v4.5.2-stable_mono_linux.x86_64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-validation
          path: artifacts/GodotValidation
